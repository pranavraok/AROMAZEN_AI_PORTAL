name: aromazen-portal

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: aromazen_ai
  DATABASE_USER: aromazen
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
  JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
  JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
  COOKIE_SECURE: "true"
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
  BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
  BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-AROMAZEN Super Admin}
  UPLOAD_STORAGE_PATH: /data/uploads
  MAX_UPLOAD_SIZE_MB: "120"
  MAX_EXCEL_UPLOAD_SIZE_MB: "120"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.5}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
  ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-anthropic}
  ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.in}
  ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-587}
  ZOHO_SMTP_SECURITY: ${ZOHO_SMTP_SECURITY:-starttls}
  ZOHO_SMTP_USERNAME: ${ZOHO_SMTP_USERNAME:-}
  ZOHO_SMTP_PASSWORD: ${ZOHO_SMTP_PASSWORD:-}
  ZOHO_FROM_EMAIL: ${ZOHO_FROM_EMAIL:-}
  ZOHO_FROM_NAME: ${ZOHO_FROM_NAME:-AROMAZEN INDIA}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-ai.aromazen.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging: *default-logging

  frontend:
    build:
      context: ./aromazen-ai
      args:
        BACKEND_API_ORIGIN: http://api:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_ORIGIN: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 700m
    logging: *default-logging

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    environment: *api-environment
    expose:
      - "8000"
    volumes:
      - ${APP_DATA_DIR:-/srv/aromazen}/uploads:/data/uploads
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1400m
    logging: *default-logging

  migrations:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aromazen_ai
      POSTGRES_USER: aromazen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aromazen -d aromazen_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 900m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 200m
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
