services:
  frontend:
    build:
      context: ./aromazen-ai
      args:
        BACKEND_API_ORIGIN: http://api:8000
    environment:
      BACKEND_API_ORIGIN: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: aromazen_ai
      DATABASE_USER: aromazen
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?set BOOTSTRAP_OWNER_EMAIL in .env}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:?set BOOTSTRAP_OWNER_PASSWORD in .env}
      UPLOAD_STORAGE_PATH: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      MAX_EXCEL_UPLOAD_SIZE_MB: ${MAX_EXCEL_UPLOAD_SIZE_MB:-25}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.5}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-anthropic}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-12000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_DAILY_TOKEN_LIMIT: ${OPENROUTER_DAILY_TOKEN_LIMIT:-1000000}
      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.in}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-587}
      ZOHO_SMTP_SECURITY: ${ZOHO_SMTP_SECURITY:-starttls}
      ZOHO_SMTP_USERNAME: ${ZOHO_SMTP_USERNAME:-}
      ZOHO_SMTP_PASSWORD: ${ZOHO_SMTP_PASSWORD:-}
      ZOHO_FROM_EMAIL: ${ZOHO_FROM_EMAIL:-}
      ZOHO_FROM_NAME: ${ZOHO_FROM_NAME:-AROMAZEN INDIA}
      ZOHO_DEPARTMENT_ACCOUNTS_JSON: ${ZOHO_DEPARTMENT_ACCOUNTS_JSON:-}
      USD_TO_INR_FALLBACK_RATE: ${USD_TO_INR_FALLBACK_RATE:-95}
      CURRENCY_RATE_CACHE_SECONDS: ${CURRENCY_RATE_CACHE_SECONDS:-3600}
    volumes:
      - knowledge_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: aromazen_ai
      DATABASE_USER: aromazen
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.5}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-anthropic}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-12000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_DAILY_TOKEN_LIMIT: ${OPENROUTER_DAILY_TOKEN_LIMIT:-1000000}
      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.in}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-587}
      ZOHO_SMTP_SECURITY: ${ZOHO_SMTP_SECURITY:-starttls}
      ZOHO_SMTP_USERNAME: ${ZOHO_SMTP_USERNAME:-}
      ZOHO_SMTP_PASSWORD: ${ZOHO_SMTP_PASSWORD:-}
      ZOHO_FROM_EMAIL: ${ZOHO_FROM_EMAIL:-}
      ZOHO_FROM_NAME: ${ZOHO_FROM_NAME:-AROMAZEN INDIA}
      ZOHO_DEPARTMENT_ACCOUNTS_JSON: ${ZOHO_DEPARTMENT_ACCOUNTS_JSON:-}
      USD_TO_INR_FALLBACK_RATE: ${USD_TO_INR_FALLBACK_RATE:-95}
      CURRENCY_RATE_CACHE_SECONDS: ${CURRENCY_RATE_CACHE_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aromazen_ai
      POSTGRES_USER: aromazen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aromazen -d aromazen_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  knowledge_uploads:
