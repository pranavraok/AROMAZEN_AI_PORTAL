[project]
name = "aromazen-ai-api"
version = "0.1.0"
description = "AROMAZEN AI Platform API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "lxml>=5.3,<7.0",
  "pgvector>=0.3,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pdfplumber>=0.11,<1.0",
  "pypdf[crypto]>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-pptx>=1.0,<2.0",
  "reportlab>=4.2,<5.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
